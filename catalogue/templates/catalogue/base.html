<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ma bibliotheque{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        nav {
            background: #eeeeee;
            padding: 12px;
            margin-bottom: 25px;
        }

        nav a {
            margin-right: 20px;
            text-decoration: none;
        }

        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px 14px; margin: 10px 0; border-radius: 4px; }
        .messages .success { background: #e7f5e9; color: #205c2a; }
        .messages .error { background: #fde8e7; color: #8a2420; }
        .errorlist { color: #a12622; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #cccccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ma bibliotheque</h1>
        <nav>
            <a href="{% url 'catalogue:livre_list' %}">Livres</a>
            <a href="{% url 'catalogue:auteur_list' %}">Auteurs</a>
            <a href="{% url 'catalogue:categorie_list' %}">Categories</a>
            <a href="{% url 'catalogue:livre_create' %}">Ajouter un livre</a>
            <a href="{% url 'catalogue:auteur_create' %}">Ajouter un auteur</a>
            <a href="{% url 'catalogue:categorie_create' %}">Ajouter une catégorie</a>
        </nav>
    </header>
    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
