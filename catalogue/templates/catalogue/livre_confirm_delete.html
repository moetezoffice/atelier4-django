{% extends "catalogue/base.html" %}

{% block title %}Supprimer un livre{% endblock %}

{% block content %}
<h2>Confirmer la suppression</h2>
<p>Voulez-vous vraiment supprimer le livre <strong>{{ livre.title }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
    <a href="{% url 'catalogue:livre_detail' livre.pk %}">Annuler</a>
</form>
{% endblock %}
